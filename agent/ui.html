<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Agent UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            --text-light: #6b7280;
            --bot-bubble: #e0e7ff;
            --user-bubble: #ffffff;
            --border: #e5e7eb;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .message.system {
            align-self: center;
            background: transparent;
            color: var(--text-light);
            font-size: 0.8rem;
            font-style: italic;
        }

        .input-area {
            padding: 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background: #f9fafb;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background: #fff;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .mic-btn {
            background: #ef4444;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }

        .mic-btn:hover {
            background: #dc2626;
        }

        .mic-btn.recording {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* SVG Icons */
        svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: var(--text-main); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 var(--text-main), .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 var(--text-main), .5em 0 0 var(--text-main); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1>BOSS AGENT</h1>
            <p>Autonomous AI Assistant</p>
        </div>
        
        <div class="messages" id="messages">
            <div class="message bot">Hello Boss. I am ready. You can type or use the mic.</div>
        </div>

        <div class="input-area">
            <button id="micBtn" class="mic-btn" title="Hold to record">
                <!-- Mic Icon -->
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" title="Send">
                <!-- Send Icon -->
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Hidden Audio element for TTS -->
    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        const messagesDiv = document.getElementById('messages');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        // Audio Recording Vars
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            
            // Format newlines
            div.innerHTML = text.replace(/\n/g, '<br>');
            
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return div;
        }

        function playAudio(url) {
            if (!url) return;
            audioPlayer.src = url;
            audioPlayer.play().catch(e => console.error("Audio play error:", e));
        }

        async function sendMessage(text) {
            if (!text.trim()) return;
            
            addMessage(text, 'user');
            textInput.value = '';
            
            const loadingMsg = addMessage('<span class="loading-dots">Boss is thinking</span>', 'bot');
            sendBtn.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                
                messagesDiv.removeChild(loadingMsg);
                addMessage(data.response, 'bot');
                playAudio(data.audio_url);
                
            } catch (err) {
                messagesDiv.removeChild(loadingMsg);
                addMessage("Error connecting to Boss Agent.", 'system');
            }
            
            sendBtn.disabled = false;
            textInput.focus();
        }

        // --- Text Sending ---
        sendBtn.addEventListener('click', () => sendMessage(textInput.value));
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(textInput.value);
        });

        // --- Voice Recording ---
        async function setupMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = async () => {
                    micBtn.classList.remove('recording');
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    
                    // Convert blob to base64
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const base64data = reader.result.split(',')[1];
                        
                        const loadingMsg = addMessage('<span class="loading-dots">Transcribing and thinking</span>', 'bot');
                        micBtn.disabled = true;
                        sendBtn.disabled = true;

                        try {
                            const response = await fetch('/voice', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ audio_base64: base64data })
                            });
                            
                            const data = await response.json();
                            messagesDiv.removeChild(loadingMsg);
                            
                            if (data.transcript) {
                                addMessage(data.transcript, 'user');
                            }
                            addMessage(data.response, 'bot');
                            playAudio(data.audio_url);
                            
                        } catch (err) {
                            messagesDiv.removeChild(loadingMsg);
                            addMessage("Error connecting to Boss Voice API.", 'system');
                        }
                        
                        micBtn.disabled = false;
                        sendBtn.disabled = false;
                    };
                };
            } catch (err) {
                alert("Microphone access denied or not available.");
            }
        }

        setupMic();

        // Click to start/stop recording
        micBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;
            
            if (!isRecording) {
                audioChunks = [];
                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
            }
        });

    </script>
</body>
</html>
