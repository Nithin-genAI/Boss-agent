<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Agent UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e6eef5;
            --surface: #e6eef5;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #2d3748;
            --text-light: #718096;
            
            /* Claymorphism 3D Shadows */
            --clay-outer: 12px 12px 24px #c3cad5, -12px -12px 24px #ffffff;
            --clay-inner: inset 6px 6px 12px #c3cad5, inset -6px -6px 12px #ffffff;
            --clay-bubble-bot: 6px 6px 12px #c3cad5, -6px -6px 12px #ffffff;
            --clay-bubble-user: inset 4px 4px 8px #c3cad5, inset -4px -4px 8px #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--surface);
            border-radius: 40px;
            box-shadow: var(--clay-outer);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header {
            padding: 25px;
            text-align: center;
            background: var(--surface);
            border-radius: 40px 40px 0 0;
            box-shadow: 0 10px 15px -10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.95rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 75%;
            padding: 16px 20px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 1rem;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.bot {
            align-self: flex-start;
            background: var(--surface);
            color: var(--text-main);
            border-bottom-left-radius: 5px;
            box-shadow: var(--clay-bubble-bot);
        }

        .message.user {
            align-self: flex-end;
            background: var(--surface);
            color: var(--primary);
            border-bottom-right-radius: 5px;
            box-shadow: var(--clay-bubble-user);
        }

        .message.system {
            align-self: center;
            background: transparent;
            color: var(--text-light);
            font-size: 0.85rem;
            font-style: italic;
            box-shadow: none;
        }

        .input-area {
            padding: 25px;
            background: var(--surface);
            display: flex;
            gap: 15px;
            align-items: center;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 -10px 15px -10px rgba(0,0,0,0.05);
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 25px;
            border: none;
            border-radius: 30px;
            font-size: 1.05rem;
            outline: none;
            background: var(--surface);
            box-shadow: var(--clay-inner);
            color: var(--text-main);
            font-weight: 500;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: inset 8px 8px 16px #c3cad5, inset -8px -8px 16px #ffffff, 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        button {
            background: var(--surface);
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--clay-bubble-bot);
        }

        button svg {
            width: 22px;
            height: 22px;
            fill: var(--primary);
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 8px 8px 16px #c3cad5, -8px -8px 16px #ffffff;
        }
        
        button:hover svg {
            transform: scale(1.1);
        }

        button:active {
            transform: translateY(0);
            box-shadow: var(--clay-inner);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: var(--clay-inner);
        }

        .mic-btn svg {
            fill: #ef4444;
        }

        .mic-btn.recording {
            animation: pulse 1.5s infinite;
            box-shadow: inset 6px 6px 12px #c3cad5, inset -6px -6px 12px #ffffff;
        }
        
        .mic-btn.recording svg {
            animation: bounce 1s infinite alternate;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: var(--primary); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 var(--primary), .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 var(--primary), .5em 0 0 var(--primary); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1>BOSS AGENT</h1>
            <p>Autonomous AI Assistant</p>
        </div>
        
        <div class="messages" id="messages">
            <div class="message bot">Hello Boss. I am ready. You can type or use the mic.</div>
        </div>

        <div class="input-area">
            <button id="micBtn" class="mic-btn" title="Hold to record">
                <!-- Mic Icon -->
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            <input type="text" id="textInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn" title="Send">
                <!-- Send Icon -->
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Hidden Audio element for TTS -->
    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        const messagesDiv = document.getElementById('messages');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        // Audio Recording Vars
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            
            // Format newlines
            div.innerHTML = text.replace(/\n/g, '<br>');
            
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return div;
        }

        function playAudio(url) {
            if (!url) return;
            audioPlayer.src = url;
            audioPlayer.play().catch(e => console.error("Audio play error:", e));
        }

        async function sendMessage(text) {
            if (!text.trim()) return;
            
            addMessage(text, 'user');
            textInput.value = '';
            
            const loadingMsg = addMessage('<span class="loading-dots">Boss is thinking</span>', 'bot');
            sendBtn.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                
                messagesDiv.removeChild(loadingMsg);
                addMessage(data.response, 'bot');
                playAudio(data.audio_url);
                
            } catch (err) {
                messagesDiv.removeChild(loadingMsg);
                addMessage("Error connecting to Boss Agent.", 'system');
            }
            
            sendBtn.disabled = false;
            textInput.focus();
        }

        // --- Text Sending ---
        sendBtn.addEventListener('click', () => sendMessage(textInput.value));
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(textInput.value);
        });

        // --- Voice Recording ---
        async function setupMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = async () => {
                    micBtn.classList.remove('recording');
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    
                    // Convert blob to base64
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const base64data = reader.result.split(',')[1];
                        
                        const loadingMsg = addMessage('<span class="loading-dots">Transcribing and thinking</span>', 'bot');
                        micBtn.disabled = true;
                        sendBtn.disabled = true;

                        try {
                            const response = await fetch('/voice', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ audio_base64: base64data })
                            });
                            
                            const data = await response.json();
                            messagesDiv.removeChild(loadingMsg);
                            
                            if (data.transcript) {
                                addMessage(data.transcript, 'user');
                            }
                            addMessage(data.response, 'bot');
                            playAudio(data.audio_url);
                            
                        } catch (err) {
                            messagesDiv.removeChild(loadingMsg);
                            addMessage("Error connecting to Boss Voice API.", 'system');
                        }
                        
                        micBtn.disabled = false;
                        sendBtn.disabled = false;
                    };
                };
            } catch (err) {
                alert("Microphone access denied or not available.");
            }
        }

        setupMic();

        // Click to start/stop recording
        micBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;
            
            if (!isRecording) {
                audioChunks = [];
                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
            }
        });

    </script>
</body>
</html>
